<head>
<meta charset="UTF-8">

<title>디자인 물품류별 물품목록 2026</title>

<meta name="theme-color" content="#15171b" media="(prefers-color-scheme: dark)">

<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">

<style>
:root{
  --bg:#f6f4ee; --surface:#fffdf8; --surface2:#efede4; --ink:#26282e; --muted:#77726a;
  --line:#e3dfd4; --accent:#2e6e60; --accent-soft:#2e6e6018; --seal:#b4552d; --mark:#f5d98a;
}
html[data-theme="dark"]{
  --bg:#15171b; --surface:#1d2026; --surface2:#23262d; --ink:#e9e7e1; --muted:#98938a;
  --line:#2e323a; --accent:#7cc4b0; --accent-soft:#7cc4b022; --seal:#e08a5e; --mark:#8a6d1f;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:15px;line-height:1.55;transition:background .25s,color .25s}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 80px}
header{position:sticky;top:0;z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.hbar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:9px;cursor:pointer;user-select:none;white-space:nowrap}
.brand .lg{width:34px;height:34px;border:2px solid var(--accent);border-radius:9px;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:15px;color:var(--accent)}
.brand b{font-size:15px;letter-spacing:-.02em}
.brand small{display:block;font-size:10.5px;color:var(--muted);font-weight:500}
#q{flex:1;min-width:80px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:9px 13px;font-size:14.5px;outline:none;transition:border .2s}
#q:focus{border-color:var(--accent)}
#themeBtn{border:1.5px solid var(--line);background:var(--surface);color:var(--ink);width:38px;height:38px;border-radius:10px;cursor:pointer;font-size:16px;flex:none}
.qwrap{flex:1;min-width:80px;position:relative}
.qwrap #q{width:100%}
#installBtn{border:none;background:var(--accent);color:var(--surface);border-radius:10px;padding:0 13px;height:38px;cursor:pointer;font-size:13px;font-weight:700;font-family:inherit;flex:none;white-space:nowrap}
#acBox{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 28px color-mix(in srgb,var(--ink) 16%,transparent);z-index:60;overflow:hidden auto;max-height:min(56vh,340px)}
.acrow{display:flex;gap:9px;align-items:baseline;padding:9.5px 13px;cursor:pointer;font-size:13.5px}
.acrow>span{font-weight:600;white-space:nowrap}
.acrow small{color:var(--muted);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acrow b{font-size:11px;color:var(--accent);white-space:nowrap;font-weight:700}
.acrow.sel,.acrow:hover{background:var(--accent-soft)}
@keyframes flashb{0%{background:var(--accent-soft)}100%{background:transparent}}
.irow.flash{animation:flashb 1.8s ease-out}
.tabs{max-width:980px;margin:0 auto;padding:0 16px;display:flex;gap:2px}
.tabs button{border:none;background:none;color:var(--muted);font-size:13.5px;font-weight:600;padding:9px 12px;cursor:pointer;border-bottom:2.5px solid transparent;font-family:inherit}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}
main{padding-top:22px}
.hero{margin-bottom:20px}
.hero .eyebrow{font-size:12px;font-weight:700;color:var(--accent);letter-spacing:.08em;margin-bottom:6px}
.hero h1{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(22px,4.5vw,30px);letter-spacing:-.01em;line-height:1.3}
.hero p{color:var(--muted);font-size:13.5px;margin-top:7px}
.hero .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.chip{font-size:12px;font-weight:600;padding:4.5px 11px;border-radius:99px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.chip.exam{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:12px}
.ccard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;cursor:pointer;display:flex;gap:13px;align-items:flex-start;transition:transform .15s,border-color .15s;position:relative}
.ccard:hover{transform:translateY(-2px);border-color:var(--accent)}
.seal{flex:none;width:46px;height:46px;border:2px solid var(--seal);color:var(--seal);border-radius:10px;display:grid;place-items:center;font-family:'Noto Serif KR',serif;font-weight:900;font-size:19px;transform:rotate(-2deg)}
.ccard h3{font-size:14.5px;font-weight:700;letter-spacing:-.01em;line-height:1.4;padding-right:6px}
.ccard .meta{font-size:12px;color:var(--muted);margin-top:5px;display:flex;gap:8px;flex-wrap:wrap}
.badge-e{font-size:10.5px;font-weight:700;color:var(--seal);background:color-mix(in srgb,var(--seal) 12%,transparent);padding:2px 7px;border-radius:5px}
.chead{display:flex;gap:15px;align-items:center;margin-bottom:8px}
.chead .seal{width:56px;height:56px;font-size:23px}
.chead h2{font-family:'Noto Serif KR',serif;font-weight:900;font-size:clamp(19px,4vw,26px);letter-spacing:-.01em;line-height:1.35}
.chead .sub{color:var(--muted);font-size:13px;margin-top:4px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.back{display:inline-flex;align-items:center;gap:5px;color:var(--muted);font-size:13px;font-weight:600;cursor:pointer;border:none;background:none;padding:4px 0;margin-bottom:14px;font-family:inherit}
.back:hover{color:var(--accent)}
.cnote{background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--seal);border-radius:10px;padding:11px 14px;font-size:13px;color:var(--muted);margin:14px 0}
.gsec{background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:12px;overflow:hidden}
.ghead{display:flex;gap:11px;align-items:baseline;padding:13px 16px;cursor:pointer}
.ghead .gno{flex:none;font-family:'Noto Serif KR',serif;font-weight:900;color:var(--accent);font-size:15px;white-space:nowrap}
.ghead .grange{font-size:13.5px;font-weight:600;flex:1}
.ghead .arr{color:var(--muted);font-size:12px;transition:transform .2s}
.gsec.open .ghead .arr{transform:rotate(90deg)}
.gnote{padding:0 16px 10px 44px;font-size:12.5px;color:var(--muted)}
.gactions{display:flex;gap:6px}
.ibtn{border:1px solid var(--line);background:var(--surface2);border-radius:8px;width:30px;height:30px;cursor:pointer;font-size:13.5px;display:grid;place-items:center;color:var(--muted);flex:none;transition:all .15s}
.ibtn:hover{border-color:var(--accent);color:var(--accent)}
.ibtn.on{color:var(--seal);border-color:var(--seal)}
.items{display:none;border-top:1px dashed var(--line)}
.gsec.open .items{display:block}
.irow{display:flex;align-items:center;gap:8px;padding:8.5px 16px;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.irow:last-child{border-bottom:none}
.irow .nm{flex:1;min-width:0;font-size:14px}
.irow .nm small{display:block;color:var(--muted);font-size:11.5px}
.irow .nm b{font-weight:600}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.srow{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;display:flex;gap:8px;align-items:center;margin-bottom:8px}
.srow .path{font-size:11px;color:var(--accent);font-weight:700;cursor:pointer;white-space:nowrap}
.srow .nm{flex:1;min-width:0}
.empty{text-align:center;color:var(--muted);padding:60px 0;font-size:14px}
.empty .big{font-size:34px;margin-bottom:10px}
h2.sec{font-size:16px;font-weight:800;margin:22px 0 12px;letter-spacing:-.01em}
.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:600;opacity:0;pointer-events:none;transition:all .25s;z-index:99;max-width:86vw}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.favfab{position:fixed;right:18px;bottom:18px;z-index:40;display:flex;flex-direction:column;gap:8px}
footer{margin-top:40px;padding-top:16px;border-top:1px solid var(--line);color:var(--muted);font-size:11.5px;line-height:1.7}
a{color:var(--accent)}
@media(max-width:640px){
  .brand small{display:none}.hbar{padding:8px 12px}.wrap{padding:0 12px 80px}
  .ccard{padding:13px}.ghead{padding:12px 13px}.irow{padding:8px 13px}
}
</style>
</head>

const byCls={}; DATA.forEach(c=>byCls[c.no]=c);
const $=s=>document.querySelector(s);
const main=$('#main'), q=$('#q');
let favs=JSON.parse(localStorage.getItem('dsc26.fav')||'{}');
let recent=JSON.parse(localStorage.getItem('dsc26.recent')||'[]');
let view='home', curQ='', openG=new Set();

function saveFav(){localStorage.setItem('dsc26.fav',JSON.stringify(favs))}
function esc(s){return s.replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m]))}
function hl(s){if(!curQ)return esc(s);const r=new RegExp('('+curQ.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+')','ig');return esc(s).replace(new RegExp(r.source,'i'),m=>'<mark>'+m+'</mark>')}
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('show'),1800)}
function go(h){location.hash=h}
function pushRecent(no){recent=[no,...recent.filter(x=>x!==no)].slice(0,12);localStorage.setItem('dsc26.recent',JSON.stringify(recent))}

/* theme */
const THEMES=['auto','light','dark'],ICON={auto:'🌗',light:'☀️',dark:'🌙'};
let theme=localStorage.getItem('dsc26.theme')||'auto';
function applyTheme(){const eff=theme==='auto'?(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'):theme;document.documentElement.dataset.theme=eff;$('#themeBtn').textContent=ICON[theme]}
function cycleTheme(){theme=THEMES[(THEMES.indexOf(theme)+1)%3];localStorage.setItem('dsc26.theme',theme);applyTheme();toast('테마: '+({auto:'시스템 따라가기',light:'라이트',dark:'다크'})[theme])}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyTheme);

/* favorites */
function favKey(c,g,i){return c+'-'+g+'-'+(i||'')}
function isFav(k){return !!favs[k]}
function toggleFav(k,label){if(isFav(k)){delete favs[k];toast('즐겨찾기에서 제거됨')}else{favs[k]={c:+k.split('-')[0],g:k.split('-')[1],i:k.split('-')[2]||'',label:label};toast('즐겨찾기에 추가됨 ★')}saveFav();render()}

/* share & copy */
function copy(txt){(navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>toast('복사됐습니다')).catch(()=>{const a=document.createElement('textarea');a.value=txt;document.body.appendChild(a);a.select();document.execCommand('copy');a.remove();toast('복사됐습니다')})}
function share(title,text,hash){
  const url=location.origin+location.pathname+(hash||'');
  if(navigator.share){navigator.share({title:title,text:text,url:url}).catch(()=>{})}
  else copy(text+'\n'+url);
}
function shareItem(c,g,it){share('제'+c+'류-'+g+'군 '+it.ko,it.ko+(it.en?' ('+it.en+')':'')+' — 제'+c+'류-'+g+'군, 디자인 물품류별 물품목록 2026','#c/'+c+'/g/'+g)}
function shareGroup(c,g){share('제'+c+'류-'+g+'군','제'+c+'류-'+g+'군 ['+byCls[c].name+'] — 디자인 물품류별 물품목록 2026','#c/'+c+'/g/'+g)}

/* views */
function tabsOn(v){document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===v))}
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{curQ='';q.value='';go('#'+b.dataset.v)});

function classCard(c){
  const gi=c.groups.reduce((s,g)=>s+g.items.length,0);
  return `<div class="ccard" onclick="go('#c/${c.no}')">
    <div class="seal">${String(c.no).padStart(2,'0')}</div>
    <div style="flex:1;min-width:0"><h3>${esc(c.name)}</h3>
      <div class="meta"><span>군 ${c.groups.length}</span><span>물품 ${gi.toLocaleString()}</span>${c.exam?'<span class="badge-e">일부심사 대상</span>':''}</div>
    </div></div>`;
}
function viewHome(){
  const examN=DATA.filter(c=>c.exam).length;
  return `<div class="hero">
    <div class="eyebrow">디자인보호법 시행규칙 별표 4 · 고시 제2025-8호</div>
    <h1>물품류별 물품목록 2026</h1>
    <p>31류 · 222군 · 9,031물품 · 2026. 1. 1. 시행 · 키워드로 물품의 류·군을 바로 찾아보세요</p>
    <div class="chips"><span class="chip exam">★ 일부심사 등록출원 대상 ${examN}개 류</span><span class="chip">로카르노 분류 제15판 반영</span></div>
  </div>
  <h2 class="sec">물품류 (제1류 ~ 제31류)</h2>
  <div class="grid">${DATA.map(classCard).join('')}</div>`;
}
function irow(c,g,it,i){
  const k=favKey(c,g.no,i);
  return `<div class="irow"><div class="nm"><b>${hl(it.ko)}</b>${it.en?`<small>${hl(it.en)}</small>`:''}</div>
  <div class="gactions">
    <button class="ibtn ${isFav(k)?'on':''}" onclick="event.stopPropagation();toggleFav('${k}',this.closest('.irow').querySelector('.nm b').textContent)" title="즐겨찾기">★</button>
    <button class="ibtn" onclick="event.stopPropagation();copy('${esc(it.ko).replace(/'/g,"\\'")}')" title="물품명 복사">⧉</button>
    <button class="ibtn" onclick="event.stopPropagation();shareItem(${c},'${g.no}',${JSON.stringify(JSON.stringify(it)).replace(/"/g,'&quot;')&&`DATA[${c-1}].groups.find(g=>g.no==='${g.no}').items[${i}]`})" title="공유">↗</button>
  </div></div>`;
}
function viewClass(no){
  const c=byCls[no]; if(!c)return viewHome();
  pushRecent(no);
  return `<button class="back" onclick="go('#home')">← 류 목록</button>
  <div class="chead"><div class="seal">${String(no).padStart(2,'0')}</div>
    <div><h2>${esc(c.name)}</h2>
    <div class="sub"><span>군 ${c.groups.length} · 물품 ${c.groups.reduce((s,g)=>s+g.items.length,0).toLocaleString()}</span>${c.exam?'<span class="badge-e">디자인일부심사등록출원 대상</span>':''}</div></div></div>
  ${c.note?`<div class="cnote">※ ${esc(c.note)}</div>`:''}
  ${c.groups.map(g=>{
    const open=openG.has(no+'-'+g.no)||g.items.length<=6;
    const k=favKey(no,g.no);
    return `<div class="gsec ${open?'open':''}" id="g${no}-${g.no}">
    <div class="ghead" onclick="this.parentElement.classList.toggle('open');openG.has('${no}-${g.no}')?openG.delete('${no}-${g.no}'):openG.add('${no}-${g.no}')">
      <span class="gno">${g.no}군</span><span class="grange">${hl(g.range||'')}</span><span class="arr">▶</span></div>
    ${g.note?`<div class="gnote">※ ${esc(g.note)}</div>`:''}
    <div class="items">${g.items.map((it,i)=>irow(no,g,it,i)).join('')}</div>
    <div style="display:flex;justify-content:flex-end;gap:6px;padding:8px 13px;border-top:1px dashed var(--line)">
      <button class="ibtn ${isFav(k)?'on':''}" onclick="event.stopPropagation();toggleFav('${k}','제${no}류 ${g.no}군')" title="군 즐겨찾기">★</button>
      <button class="ibtn" onclick="event.stopPropagation();shareGroup(${no},'${g.no}')" title="군 공유">↗</button>
      <button class="ibtn" onclick="event.stopPropagation();copy('제${no}류 ${g.no}군')" title="류·군 복사">⧉</button>
    </div></div>`;
  }).join('')}`;
}
function srowFor(c,g,it,i){
  return `<div class="srow"><span class="path" onclick="curQ='';q.value='';go('#c/${c}/g/${g}')">제${c}류-${g}군</span>
  <div class="nm"><b>${hl(it.ko)}</b>${it.en?` <small style="color:var(--muted)">${hl(it.en)}</small>`:''}</div>
  <div class="gactions">
    <button class="ibtn ${isFav(favKey(c,g,i))?'on':''}" onclick="event.stopPropagation();toggleFav('${favKey(c,g,i)}',this.parentElement.querySelector('.nm b').textContent)">★</button>
    <button class="ibtn" onclick="event.stopPropagation();copy('${esc(it.ko).replace(/'/g,"\\'")}')">⧉</button>
    <button class="ibtn" onclick="event.stopPropagation();shareItem(${c},'${g}',DATA[${c-1}].groups.find(x=>x.no==='${g}').items[${i}])">↗</button>
  </div></div>`;
}
function viewFav(){
  const keys=Object.keys(favs);
  if(!keys.length)return `<div class="empty"><div class="big">☆</div>아직 즐겨찾기가 없습니다.<br>물품·군 옆의 ★를 눌러 자주 쓰는 물품을 모아보세요.</div>`;
  return `<h2 class="sec">즐겨찾기 ${keys.length}건</h2>
  <div style="display:flex;gap:8px;margin-bottom:12px"><button class="ibtn" onclick="exportFav()" title="JSON 내보내기">⭳ 내보내기</button>
  <label class="ibtn" style="width:auto;padding:0 10px;cursor:pointer" title="가져오기">⭱ 가져오기<input type="file" accept=".json" style="display:none" onchange="importFav(this)"></label>
  <button class="ibtn" style="width:auto;padding:0 10px;color:var(--seal)" onclick="favs={};saveFav();render();toast('모두 지웠습니다')">전체 삭제</button></div>
  ${keys.map(k=>{const f=favs[k],c=byCls[f.c];if(!c)return '';const g=c.groups.find(x=>x.no===f.g);if(!g)return '';
    if(f.i==='')return `<div class="srow"><span class="path" onclick="go('#c/${f.c}/g/${f.g}')">제${f.c}류-${f.g}군</span><div class="nm"><b>${esc(f.label||g.range)}</b></div>
      <button class="ibtn on" onclick="toggleFav('${k}')">★</button></div>`;
    const i=+f.i,it=g.items[i];if(!it)return '';
    return srowFor(f.c,f.g,it,i)}).join('')}`;
}
function viewRecent(){
  if(!recent.length)return `<div class="empty"><div class="big">🕘</div>최근에 본 류이 여기에 표시됩니다.</div>`;
  return `<h2 class="sec">최근 본 류</h2><div class="grid">${recent.filter(n=>byCls[n]).map(n=>classCard(byCls[n])).join('')}</div>`;
}
function viewSearch(){
  const r=[];const qx=curQ.toLowerCase();
  outer:for(const c of DATA)for(const g of c.groups)for(let i=0;i<g.items.length;i++){const it=g.items[i];
    if((it.ko&&it.ko.toLowerCase().includes(qx))||(it.en&&it.en.toLowerCase().includes(qx))||(g.range&&g.range.toLowerCase().includes(qx))){
      r.push([c.no,g.no,it,i]);if(r.length>=300)break outer;}}
  return `<h2 class="sec">검색 결과 <span style="color:var(--muted);font-weight:500;font-size:13px">‘${esc(curQ)}’ — ${r.length}${r.length>=300?'+':''}건</span></h2>
  ${r.length?r.map(([c,g,it,i])=>srowFor(c,g,it,i)).join(''):`<div class="empty"><div class="big">🔍</div>‘${esc(curQ)}’ 검색 결과가 없습니다.<br>다른 키워드로 검색해 보세요.</div>`}`;
}
function render(){
  tabsOn(view);
  if(curQ)main.innerHTML=viewSearch();
  else if(view==='fav')main.innerHTML=viewFav();
  else if(view==='recent')main.innerHTML=viewRecent();
  else if(view.startsWith('c/')){const[_,n,g]=view.split('/');main.innerHTML=viewClass(+n);
    if(g){const el=document.getElementById('g'+n+'-'+g);if(el){el.classList.add('open');openG.add(n+'-'+g);setTimeout(()=>el.scrollIntoView({block:'start'}),40)}}}
  else main.innerHTML=viewHome();
}
function route(){
  const h=location.hash.replace(/^#/,'');
  if(h.startsWith('c/')||h==='fav'||h==='recent'||h==='home'){view=h;if(!h.startsWith('c/'))curQ='',q.value=''}
  else view='home';
  render();
}
addEventListener('hashchange',route);
/* ---- autocomplete ---- */
const IDX=[];
DATA.forEach(c=>c.groups.forEach(g=>g.items.forEach((it,i)=>IDX.push({ko:it.ko,en:it.en,c:c.no,g:g.no,i}))));
const acBox=$('#acBox');
let acSel=-1, acList=[];
function acHide(){acBox.hidden=true;acSel=-1}
function acRender(){
  const v=q.value.trim().toLowerCase();
  if(!v){acHide();return}
  const starts=[],incl=[];
  for(const d of IDX){
    const ko=d.ko.toLowerCase(), en=(d.en||'').toLowerCase();
    if(ko.startsWith(v)||en.startsWith(v)) starts.push(d);
    else if(ko.includes(v)||en.includes(v)) incl.push(d);
    if(starts.length>=8)break;
  }
  acList=starts.concat(incl).slice(0,8);
  if(!acList.length){acHide();return}
  acSel=0;
  acBox.innerHTML=acList.map((d,i)=>`<div class="acrow${i===acSel?' sel':''}" data-i="${i}"><span>${esc(d.ko)}</span><small>${esc(d.en||'')}</small><b>제${d.c}류-${d.g}군</b></div>`).join('');
  acBox.hidden=false;
}
function acGo(d){
  acHide();
  q.value=d.ko; curQ='';
  openG.add(d.c+'-'+d.g);
  go('#c/'+d.c+'/g/'+d.g);
  setTimeout(()=>{
    const row=document.querySelectorAll('#g'+d.c+'-'+d.g+' .items .irow')[d.i];
    if(row){row.scrollIntoView({block:'center'});row.classList.add('flash');setTimeout(()=>row.classList.remove('flash'),1900)}
  },90);
}
acBox.addEventListener('mousedown',e=>{const r=e.target.closest('.acrow');if(r){e.preventDefault();acGo(acList[+r.dataset.i])}});
q.addEventListener('input',()=>{curQ=q.value.trim();view='search';tabsOn('');render();acRender()});
q.addEventListener('focus',acRender);
q.addEventListener('keydown',e=>{
  if(!acBox.hidden){
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      acSel=(acSel+(e.key==='ArrowDown'?1:-1)+acList.length)%acList.length;
      acBox.querySelectorAll('.acrow').forEach((r,i)=>r.classList.toggle('sel',i===acSel));
      acBox.children[acSel].scrollIntoView({block:'nearest'});
      return;
    }
    if(e.key==='Enter'){e.preventDefault();acGo(acList[acSel]);return}
  }
  if(e.key==='Enter'&&curQ){view='search';render();return}
  if(e.key==='Escape'){if(!acBox.hidden){acHide();return}q.value='';curQ='';go('#home')}
});
document.addEventListener('pointerdown',e=>{if(!e.target.closest('.qwrap'))acHide()});
addEventListener('keydown',e=>{if(e.key==='/'&&document.activeElement!==q){e.preventDefault();q.focus()}});
function exportFav(){
  const blob=new Blob([JSON.stringify(favs)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='design-class-favorites.json';a.click();toast('내보냈습니다');
}
function importFav(inp){const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{Object.assign(favs,JSON.parse(r.result));saveFav();render();toast('가져왔습니다')}catch(e){toast('파일을 읽을 수 없습니다')}};r.readAsText(f)}
/* ---- PWA ---- */
let deferredPrompt=null;
const installBtn=$('#installBtn');
addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;installBtn.hidden=false});
installBtn.addEventListener('click',async()=>{
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const{outcome}=await deferredPrompt.userChoice;
  deferredPrompt=null;installBtn.hidden=true;
  toast(outcome==='accepted'?'설치됐습니다. 홈 화면에서 실행하세요':'설치가 취소됐습니다');
});
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
  addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
}
applyTheme();route();
</script>
</body>
</html>
